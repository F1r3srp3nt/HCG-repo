# HCG products. Each one gets a product page at products/<key>/ on the website, linked to its
# HCG Store page, and is shown in the "Planned" section of the landing page.
#
# A product listed here is shown as NOT AVAILABLE, with no install button, unless a package with
# one of its `package_ids` is actually present in the generated Packages index. In that case the
# website shows the real indexed package instead and hides this planned entry.
#
# Fields:
#   key            product page route products/<key>/ and the HCG Store access-check key
#   store_slug     HCG Store product page <store>apps/<store_slug>
#   store_edition  optional; appended as ?edition=<store_edition>
#   package_ids    Debian package IDs that belong to this product (none if it has no package)
#   layouts        optional; architectures the product's packaging declares
#   access         public | login-required | paid. Missing = login-required.
#                  Only `public` packages may be imported, indexed or published here; every
#                  other package is refused by the validator, because everything this
#                  repository publishes is downloadable by anyone. Every package in the
#                  com.hakmicapitalgroup. namespace must be listed under exactly one product.
#                  Current HCG release policy: every product is login-required or paid.
#
# Never describe build or device-test results here that have not happened. See
# docs/STORE_INTEGRATION.md.

[[products]]
key = "hcg-terminal-unleashed"
name = "HCG Terminal Unleashed"
package_ids = ["com.hakmicapitalgroup.hcgterminal.unleashed"]
layouts = ["iphoneos-arm64", "iphoneos-arm"]
kind = "App"
status = "Packaging under review"
summary = "Jailbreak edition of HCG Terminal: a local shell in a pseudo-terminal using the access the device already grants. Separate from the sandboxed App Store / TestFlight edition."
detail = "No .deb has been imported yet. It will be listed here only after a build passes repository validation; it will be labelled Experimental until device tests are recorded."
store_slug = "hcg-terminal"
store_edition = "unleashed"
access = "login-required"

[[products]]
key = "hcg-nexus"
name = "HCG Nexus"
package_ids = ["com.hakmicapitalgroup.hcgnexus"]
layouts = ["iphoneos-arm64"]
kind = "Planned"
status = "Release candidate"
summary = "An HCG command panel with searchable shortcuts, workspaces, recent actions, HCG integration status and settings."
detail = "Version 0.2.0 is the first device release candidate. It has not yet run on a physical device, and no package has been published. Rootless (iOS 15.0 and later) is the release target; rootful is not supported until it has been verified."
store_slug = "hcg-nexus"
store_edition = "jailbreak"
access = "login-required"

[[products]]
key = "hcg-sentinel"
name = "HCG Sentinel"
package_ids = []
kind = "Planned"
status = "Not available"
summary = "A native SwiftUI iPhone and iPad app (iOS 14.7+) for authorised testing of your own devices, networks and services."
detail = "HCG Sentinel has no Debian package and no jailbreak build, so it cannot be installed from HCG Repo. It is listed so that HCG Store and HCG Repo can link to each other."
store_slug = "hcg-sentinel"
access = "login-required"
