# Projects shown on the website under "In development". Each one also gets a product page at
# products/<key>/ that links to its HCG Store page (docs/STORE_INTEGRATION.md).
#
# A project listed here is shown as NOT INSTALLABLE, with no install action, unless a package with
# one of its `package_ids` is actually present in the generated Packages index. In that case the
# website shows the real indexed package instead and hides this entry.
# access = "connect" | "paid" puts it under "Sign-in required" (HCG Connect / HCG Store).
# Who may download a package is decided by `[access] level` in packages/<id>/package.toml
# (docs/ACCESS.md).
#
# Product page and HCG Store fields:
#   key            product page route products/<key>/ and the HCG Store access-check key
#   store_slug     HCG Store product page <store>apps/<store_slug>; omit for a product that is not in HCG Store
#   store_edition  optional; appended as ?edition=<store_edition>
#   layouts        optional; architectures the product's packaging declares
#
# Never describe build or device-test results here that have not happened.

[[products]]
key = "hcg-terminal-unleashed"
name = "HCG Terminal Unleashed"
package_ids = ["com.hakmicapitalgroup.hcgterminal.unleashed"]
layouts = ["iphoneos-arm64", "iphoneos-arm"]
kind = "Jailbreak app"
access = "connect"
status = "Not yet available"
summary = "Jailbreak edition of HCG Terminal: a local shell in a pseudo-terminal using the access the device already grants. Separate from the sandboxed App Store / TestFlight edition."
detail = "Requires iOS 17 or later. Free release candidate 0.2.0~rc1 in the HCG Repo Candidate testing channel (owner-approved, not yet verified on a physical device). Other versions need HCG Connect sign-in, which is not live yet."
store_slug = "hcg-terminal"
store_edition = "unleashed"

[[products]]
key = "hcg-nexus"
name = "HCG Nexus"
package_ids = ["com.hakmicapitalgroup.hcgnexus"]
layouts = ["iphoneos-arm64"]
kind = "Jailbreak tweak"
access = "paid"
status = "Not yet available"
summary = "Smoked-glass command panel behind a cyan edge handle: Overview, Workspaces, Tools, HCG Products, Apps and Command Mode."
detail = "Available in Sileo once HCG Connect sign-in and HCG Store purchases are live. Free candidate beta in the HCG Repo Candidate testing channel: 0.3.1~beta1 (redesign, Command Mode and the HCG Halo border interface, for HCG Halo 0.2.0~beta1), simulator-tested; real-device testing pending. Earlier candidates 0.2.2~beta1 and 0.2.1~beta1 remain listed."
store_slug = "hcg-nexus"
store_edition = "jailbreak"

[[products]]
key = "hcg-sentinel"
name = "HCG Sentinel"
package_ids = []
kind = "App — no jailbreak package"
status = "In development"
summary = "Toolkit for authorised testing of your own devices, networks and services."
detail = "Sentinel ships as a standard app. Its optional privileged helper exists only as a specification, so there is nothing to install from this repository yet."
store_slug = "hcg-sentinel"

[[products]]
# Free experimental beta (proprietary freeware, no sign-in), public by an explicit exception scoped to the approved
# versions in packages/com.hakmicapitalgroup.vortex/package.toml. No HCG Store product page exists yet, so there is no
# store_slug and the page shows no Store actions; add one when a real Store page exists (future versions may offer
# optional premium features through HCG Store). Not installable until the verified .deb is imported (docs/VORTEX.md).
key = "hcg-vortex"
name = "HCG Vortex"
package_ids = ["com.hakmicapitalgroup.vortex"]
layouts = ["iphoneos-arm64"]
kind = "Jailbreak tweak"
access = "public"
status = "Experimental beta in testing: installation failed"
summary = "Home Screen page transitions with six icon effects (Tornado, Orbital, Warp, Holographic Layers, Circuit Flow, Magnetic Grid), plus Reverse Slide, Vertical Rise, Vertical Fall and custom directions."
detail = "Free experimental beta, no sign-in, in the HCG Repo Candidate testing channel only. Rootless (iphoneos-arm64). Offered: 0.3.1~beta1, not yet installed on a device. A phone recording of the previous build (version not confirmed) showed 3 of 6 effects running, with visual bugs that 0.3.1~beta1 fixes. Performance and battery impact unmeasured. 0.1.0~beta1 failed to install on iPhone 11 Pro Max, iOS 17.4."

[[products]]
# HCG Animation Center: first commercial prerelease listing (docs/COMMERCIAL.md). The product registry entry is the
# only place HCG Repo describes it; HCG Store (catalogue + server-side offers) stays authoritative for pricing,
# purchases, entitlements and delivery. The free candidate demo 0.1.0~beta1 stays in HCG Repo Candidate under its
# own approval and is never the commercial build.
key = "hcg-animation-center"
name = "HCG Animation Center"
package_ids = ["com.hakmicapitalgroup.animationcenter"]
layouts = ["iphoneos-arm64"]
kind = "Jailbreak tweak"
access = "paid"
status = "Coming Soon"
summary = "Advanced iOS animation customization."
detail = "Introductory prerelease. Purchasing and installation open once HCG Store is ready."
store_slug = "hcg-animation-center"

[products.commercial]
release_channel = "commercial-prerelease"
publisher = "Hakmi Capital Group"
category = "iOS Customization / Jailbreak Tweaks"
# Announced introductory price, shown on the listing. HCG Store's server-side offer sets the price actually charged.
price = "1.99"
currency = "USD"
price_note = "Introductory Prerelease Price"
availability = "Coming Soon"
source_channel = "candidate"
destination = "main"
# Owner wording, adjusted only where the build does not support it: 0.1.0~beta1 plays the user's own videos and GIFs
# as animated backgrounds (it does not change system interface animations), and no device has been verified.
description = [
  "HCG Animation Center brings advanced animation customization to jailbroken iPhones, providing new ways to personalize the iPhone experience through configurable animated backgrounds: your own videos and GIFs, playing behind the Home Screen icons.",
  "Developed by Hakmi Capital Group, Animation Center is designed to integrate with the expanding HCG software ecosystem.",
  "This introductory prerelease will become available once HCG Store’s payment and licensing infrastructure is operational. Rootless jailbreaks only (iphoneos-arm64); device compatibility has not been verified yet.",
]
# No HCG Store catalogue page exists for this product yet: the listing shows a placeholder and links no Store URL.
store_page = "pending"
# Owner-controlled release settings. Each starts closed; any other value needs a matching approval below
# (setting, value, approved_by, date, record). See docs/COMMERCIAL.md for the order and the exact steps.
# Owner decision of 21 Nov 2026: the public product listing ONLY. Purchases, downloads, installation and the
# commercial release are NOT approved, HCG Store readiness is pending, and no commercial version is approved.
listing = "approved"
purchases = "disabled"
downloads = "disabled"
installation = "disabled"
commercial_release = "not-approved"
store_readiness = "pending"
approved_version = ""

[[products.commercial.approvals]]
setting = "listing"
value = "approved"
approved_by = "owner (Hakmi Capital Group)"
date = "2026-11-21"
record = "Owner decision: Approved for public product listing. Product: HCG Animation Center. Package ID: com.hakmicapitalgroup.animationcenter. Price: $1.99 USD, introductory prerelease. Public listing: Approved. Purchases: Not approved. Downloads: Not approved. Installation: Not approved. Commercial release: Not approved. HCG Store readiness: Pending. Approved commercial version: None. This authorization applies only to publishing the product listing; it is not approval of any executable package. Deployment remains subject to successful validation and the owner's separate confirmation before merge and Publish."
