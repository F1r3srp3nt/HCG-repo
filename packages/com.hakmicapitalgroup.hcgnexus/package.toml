# Presentation and review metadata for HCG Nexus (jailbreak tweak).
# Version, architecture and dependencies come from the .deb itself. Icon: HCG-Nexus
# App/Assets.xcassets/AppIcon.appiconset/Icon-180.png at commit 1341669.

[display]
summary = "Command panel behind a configurable cyan edge handle: shortcuts, workspaces, search and recent actions."
icon = "icon.png"
tint = "#2FD3E6"
notes = """
HCG Nexus adds a cyan edge handle to SpringBoard. Tap or swipe it to open a command panel with searchable shortcuts, workspaces and recent actions, and launch installed apps or links from it.

**It is off after installation.** Turn it on in *Settings › HCG Nexus*. The package has no install scripts and never resprings by itself.
"""
limitations = """
- **Not yet run on a physical device.** It is the first device release candidate, built with Xcode for the confirmed target (iPhone 13 Pro, iOS 16.5, Dopamine rootless, ElleKit, Sileo).
- Rootless only (`iphoneos-arm64`). A rootful build exists in the source project but is not supported until verified.
- The binaries target iOS 15.0 and later, but the package declares no iOS range, so Sileo may offer it on other rootless iOS versions. Only the configuration above is the intended target.
- Needs a tweak injector (ElleKit, Substitute, Substrate or libhooker) and PreferenceLoader. Sileo offers these if they are missing.
- HCG Server and Executable Maker integrations show *Not connected*; they are not implemented in this release.
"""
install = """
1. Install **HCG Nexus** in Sileo and accept the dependencies it offers (PreferenceLoader, an injector).
2. Respring when you choose: Sileo's *Restart SpringBoard* button or the Respring action in your jailbreak app.
3. Open **Settings › HCG Nexus**. *Status* should show the installed version and *SpringBoard: Running*.
4. Turn on **Enable HCG Nexus**. The handle appears on the right edge without another respring.
"""
removal = """
1. **Turn it off:** Settings › HCG Nexus › Enable HCG Nexus → off. The handle disappears immediately.
2. **Uninstall:** Sileo → *Installed* → **HCG Nexus** → *Remove*, then respring.
3. Settings and workspaces remain in `/var/mobile/Library/Preferences/com.hakmicapitalgroup.hcgnexus.plist`. Delete that file only if you also want to erase your workspaces.
4. **If SpringBoard keeps crashing:** reboot. Dopamine is semi-untethered, so the phone starts without tweaks. Then remove HCG Nexus in Sileo before re-enabling tweak injection.
"""

[review]
allow_setuid = []
# No entitlements are expected on the tweak dylib or the Settings bundle. If the imported
# binaries carry any, the import fails until they are reviewed and recorded here.

[access]
# Paid: HCG Connect sign-in plus HCG Store ownership. Never stored or served publicly here.
level = "paid"
