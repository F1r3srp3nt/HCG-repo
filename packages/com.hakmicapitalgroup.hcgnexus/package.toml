# Presentation and review metadata for HCG Nexus (jailbreak tweak).
# Version, architecture and dependencies come from the .deb itself. Icon: HCG-Nexus
# App/Assets.xcassets/AppIcon.appiconset/Icon-180.png at commit 1341669.
#
# HCG Nexus is a paid product. Its owner-approved candidate builds (exception_versions in [access] below) are free public
# demos in the HCG Repo Candidate channel only. The current one is 0.6.0~beta1: the HCG Nexus Command Center. Earlier
# approved betas, including 0.4.0~beta1 and 0.5.0~beta1, stay published (superseded). 0.3.0~beta1 was approved but
# never imported.
# 0.2.0 and every other version, including the 0.2.1 release, stay paid and protected.

[release]
channel = "beta"

[display]
known_issues = """
- **0.6.0~beta1 is simulator-tested only; real-device testing is pending.** CI built it with Xcode, ran its tests and launched the standalone app in the iOS Simulator. It has not been installed on a phone.
- **Connected means proven.** A product shows *Connected* only after a real two-way exchange (for example *Check now* reading HCG News). Installed apps show *Installed*, never *Connected*.
- **HCG sign-in is not configured:** HCG Nexus has no HCG Connect client yet, so sign-in, central permissions and private products stay off.
- **HCG Repo is unsigned today,** so the Package Trust Center shows it as *Unsigned*. Nexus never calls a package safe because its checksum matches.
- The HCG logo is the founder's temporary official mark. Products without official icons use generic system symbols.
- Connected Devices (HCG Device Link) is a feature of the standalone HCG Nexus app, not of this tweak.
"""
summary = "The HCG ecosystem command center: every HCG product, evidence-based connections, roadmap and Package Trust Center."
icon = "icon.png"
tint = "#2FD3E6"
notes = """
HCG Nexus is the **HCG ecosystem command center** on your iPhone. A cyan edge handle opens a smoked-glass panel with **Overview**, **Workspaces**, **Tools**, **HCG Ecosystem**, **Apps** and **Account**.

**Command Center** (HCG Ecosystem › Command Center): every HCG product by category with search, favorites and a profile for each — install status, version, connection status with the last successful communication, capabilities, how it connects, development requirements and roadmap. Opening it starts no connection.

**Roadmap:** each product's development state with the evidence behind it, and an export of development gaps as an HCG LifeOS import file.

**Connected devices:** import the device inventory exported by HCG System Tester on your Mac. Nexus only reads the file; it never controls a device.

**Package Trust Center:** repository signatures, checksums and device-compatibility evidence, kept separate. Read-only.

**Free public demo:** this candidate build needs no sign-in and no payment. Device compatibility is unverified until tested.

**It is off after installation.** Turn it on in *Settings › HCG Nexus*. The package has no install scripts and never resprings by itself.
"""
limitations = """
- **Tested:** 0.6.0~beta1 in CI and the iOS Simulator only. No configuration counts as tested until a device result is recorded under Tested devices.
- **Intended test targets:** iPhone 13 Pro, iOS 16.5, and iPhone 11 Pro Max, iOS 17.4, both Dopamine (rootless) with ElleKit and PreferenceLoader. Other rootless setups are untested.
- Rootless only (`iphoneos-arm64`), iOS 15.0 or later (declared).
- Needs a tweak injector (ElleKit, Substitute, Substrate or libhooker) and PreferenceLoader.
- *Check now* reads public HCG pages only when you tap it; Nexus sends no account, key or cookie.
- Connected Devices and HCG sign-in belong to the standalone app; the tweak says so instead of offering them.
"""
install = """
1. Add **HCG Repo Candidate** (`https://repo.hakmicapitalgroup.com/repo/candidate/`), refresh, and install **HCG Nexus** 0.6.0~beta1. Accept the dependencies it asks for (PreferenceLoader, an injector) if they are not installed yet.
2. Respring once (your package manager's restart button or the Respring action in the jailbreak app). The package never resprings by itself.
3. Open **Settings › HCG Nexus**. *Status* should show *Installed 0.6.0~beta1* and *SpringBoard: Running*.
4. Turn on **Enable HCG Nexus**. The handle appears on the right edge without another respring.
"""
removal = """
1. **Turn it off:** Settings › HCG Nexus › Enable HCG Nexus → off. The handle disappears immediately.
2. **If Settings can't be opened:** create `/var/mobile/Library/Preferences/com.hakmicapitalgroup.hcgnexus.killswitch` (Filza or `touch` in a terminal), then respring. Nexus stays inactive until the file is deleted.
3. **Uninstall:** in your package manager, remove **HCG Nexus**, or `sudo dpkg -r com.hakmicapitalgroup.hcgnexus` in a terminal, then respring.
4. Settings and workspaces remain in `/var/mobile/Library/Preferences/com.hakmicapitalgroup.hcgnexus.plist`. Delete that file only if you also want to erase your workspaces.
5. **If SpringBoard keeps crashing:** reboot. Dopamine is semi-untethered, so the phone starts without tweaks. Then remove HCG Nexus before re-enabling tweak injection.
"""

[review]
allow_setuid = []
# No entitlements are expected on the tweak dylib or the Settings bundle. If the imported
# binaries carry any, the import fails until they are reviewed and recorded here.

[access]
# Paid: HCG Connect sign-in plus HCG Store ownership. Never stored or served publicly here,
# EXCEPT the exact versions in exception_versions, which are free in the candidate channel.
level = "paid"
exception = "Free public demo (no sign-in, no payment) in HCG Repo Candidate under the owner's free-demo policy for approved candidate builds, approved by the owner on 17 Nov 2026 (0.2.1~beta1) and 18 Nov 2026 (0.2.2~beta1 and 0.3.1~beta1: candidate builds of the HCG Halo × HCG Nexus integration 'authorised as free public demos with no account or payment requirement', 'Candidate publication is already authorised'; 0.3.0~beta1: 'Candidate builds are free public demos', approved but never imported; 19 Nov 2026 for 0.3.2~beta1, with HCG Halo 0.3.1~beta1: 'Approved: import and publish HCG Nexus 0.3.2~beta1 and HCG Halo 0.3.1~beta1 together as free public betas in HCG Repo Candidate'; 21 Nov 2026 for 0.3.3~beta1: 'Approve publishing to repo candidate'; 26 Nov 2026 for 0.6.0~beta1: 'Approve publishing 0.6.0~beta1 to repo candidate'; 26 Nov 2026 for 0.4.0~beta1 and 0.5.0~beta1: 'approve both for candidate free version') for the versions in exception_versions only. HCG Nexus stays a paid product: 0.2.0 and every other version (including the 0.2.1 release) remain paid and protected, and any further free build needs its own approval."
exception_versions = ["0.2.1~beta1", "0.2.2~beta1", "0.3.0~beta1", "0.3.1~beta1", "0.3.2~beta1", "0.3.3~beta1", "0.4.0~beta1", "0.5.0~beta1", "0.6.0~beta1"]

[versions."0.6.0~beta1"]
status = "experimental"
label = "Free public demo — HCG Nexus Command Center; simulator-tested, real-device testing pending."

[versions."0.5.0~beta1"]
status = "experimental"
label = "Superseded by 0.6.0~beta1 — Package Trust Center; simulator-tested, real-device testing pending."

[versions."0.4.0~beta1"]
status = "experimental"
label = "Superseded by 0.6.0~beta1 — HCG Ecosystem dashboard and HCG Interchange Protocol; simulator-tested, real-device testing pending."

[versions."0.3.1~beta1"]
status = "experimental"
label = "Superseded — redesign + Command Mode + HCG Halo border interface; simulator-tested, real-device testing pending."

[versions."0.2.2~beta1"]
status = "experimental"
label = "Superseded by 0.3.1~beta1 — 0.2.1~beta1 plus the HCG Halo border interface; not yet device-tested."

[versions."0.2.1~beta1"]
status = "experimental"
label = "Free public beta demo — owner reports Nexus running on iPhone 13 Pro (version not stated); not yet a recorded device test."

# Published, immutable builds whose control data cannot change without a new version (bytes, URLs and checksums are
# never replaced). Fixed from 0.6.0~beta1 on, which declares firmware (>= 15.0). The website and the compatibility
# registry already state iOS 15.0+ for every version (derived from the binaries).
[[validation.acknowledged]]
code = "firmware-undeclared"
versions = ["0.2.1~beta1", "0.2.2~beta1", "0.3.1~beta1", "0.3.2~beta1", "0.3.3~beta1", "0.4.0~beta1", "0.5.0~beta1"]
reason = "published Candidate builds kept for rollback; their Depends cannot change without new bytes; fixed in 0.6.0~beta1 (firmware >= 15.0); iOS 15.0+ is shown on every page"
reviewed_by = "HCG Repo maintainers (Claude), on the owner's instruction of 28 Nov 2026 to resolve the warnings without changing package identities"
date = "2026-11-28"
