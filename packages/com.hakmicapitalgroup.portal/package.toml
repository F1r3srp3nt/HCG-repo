# Presentation and review metadata for HCG Portal (free public beta demo, candidate channel).
# Package ID, name, version, architecture, dependencies, size and checksums always come from the imported .deb;
# nothing here can override them. Listing text from the project's handoff
# (F1r3srp3nt/HCG-Jailbreak-Research, HCGPortal/distribution/hcg-repo/).
# Icon: PROVISIONAL original artwork (HCGPortal/scripts/make_icon.py, 180 px), the same image as the Settings icon
# inside the .deb. Replace when official artwork exists.

[release]
channel = "beta"

[access]
# HCG's default access level for its packages (HCG Connect sign-in). Production pricing and access are NOT decided by
# this file; the owner sets them before any release. The exception below makes ONLY the listed candidate version a
# free public demo (no sign-in, no payment) under HCG Repo's free-demo policy (docs/ACCESS.md), which keeps it out of
# the stable source. Any other version needs its own approval.
level = "connect"
exception = "Free public beta demo (no sign-in, no payment) in HCG Repo Candidate only, under the owner's authorisation of HCG Portal 0.1.0~beta1 as a free public candidate demo at https://repo.hakmicapitalgroup.com/repo/candidate/ (18 Nov 2026), for the versions in exception_versions only. This does not change production pricing or access; no expiry date and no remote disabling."
exception_versions = ["0.1.0~beta1"]

[display]
# summary is intentionally empty: the listing uses the Description from the .deb's control file.
icon = "icon.png"
tint = "#33E6FF"
notes = """
**Free public beta demo.** No sign-in and no payment. Expect rough edges and please report problems.

HCG Portal adds a **luminous, interactive portal** to your Lock Screen, below the clock and above your notifications: a dark translucent centre with slowly turning cyan-and-violet energy rings.

- **Tap it** for a radial menu: **Nexus**, **Backgrounds**, **Devices** and **HCG Apps**. Tap outside to close it.
- **Your passcode stays in charge.** Anything that opens an app or a page asks for **Face ID, Touch ID or your passcode** first, and only the item you chose opens. Cancel, and nothing happens.
- **Backgrounds** opens Settings for HCG Animation Center. **HCG Apps** holds up to six apps you choose. **Devices** shows *Not connected* until HCG Connector / Origin exist. **Nexus** needs a future HCG Nexus update.
- **Stays out of the way:** it moves, shrinks or collapses to a small orb around notifications, media controls, the flashlight and the camera, and only the portal itself takes a tap.
- **Make it yours:** position and size with a live preview and Reset, four colour themes, brightness, animation speed and intensity, an optional opening animation on unlock.

**It is off after installation**: turn it on in *Settings › HCG Portal*. Changes apply without a respring. Reduce Motion shows a still portal; Low Power Mode keeps it still by default.

No account, telemetry or network access.
"""
known_issues = """
- **Not yet device-tested.** Built and validated with Xcode and tested in the iOS Simulator with stand-ins for the Lock Screen. That is not a device result.
- **Nexus cannot be opened yet:** HCG Nexus 0.3.1~beta1 offers no way for another tweak to open its panel. Portal shows *Update needed*.
- **Backgrounds opens Settings,** not HCG Animation Center's page directly: Animation Center has no deep link yet.
- The Lock Screen layout differs between iOS versions; if Portal can't find the clock it estimates its position, and if it can't find room it hides. Settings shows what it measured.
- **May crash SpringBoard.** Safety checks (off by default, kill switch, crash-loop guard, fault fallback) reduce but cannot rule this out. See Removal.
- Battery and performance impact have not been measured. The icon is provisional.
"""
limitations = """
- **Tested:** nothing on a device yet.
- Rootless only (`iphoneos-arm64`). Needs a Substrate-compatible injector (ElleKit) and PreferenceLoader. The minimum of iOS 15.0 is a build setting, not a compatibility claim.
- Devices is a placeholder (*Not connected*). Typed commands, voice, device selection and Agent Runtime actions are on the roadmap only.
- Coexistence with other Lock Screen tweaks is untested.
"""
install = """
1. Add **HCG Repo Candidate** (`https://repo.hakmicapitalgroup.com/repo/candidate/`), refresh, and install **HCG Portal (Beta)**. Accept the dependencies offered (PreferenceLoader, an injector).
2. Respring when you choose. Nothing changes yet: it is off after installation.
3. Open **Settings › HCG Portal**, turn on **Enable HCG Portal**, and lock your phone.
4. Optional: **Position & Size**, colours, and **HCG Apps** to choose your app shortcuts.
"""
removal = """
1. **Turn it off:** Settings › HCG Portal › **Enable HCG Portal** → off. The portal disappears at once.
2. **Uninstall:** remove **HCG Portal (Beta)** in your package manager, then respring. Your Lock Screen is exactly as before.
3. **If Settings can't be opened:** over SSH, `touch /var/mobile/Library/Preferences/com.hakmicapitalgroup.portal.disabled`, then respring.
4. **If SpringBoard keeps crashing:** after three quick crashes in a row it turns itself off (*Auto-disabled*). Otherwise reboot: rootless jailbreaks such as Dopamine are semi-untethered, so the phone starts without tweaks. Remove the package before re-enabling tweak injection.
"""

[review]
allow_setuid = []
# No entitlements are expected on the tweak dylib or the Settings bundle; the import fails if any appear.

[versions."0.1.0~beta1"]
status = "experimental"
label = "Free public beta demo — Simulator-tested, not yet device-tested."
# No device_tests entry until a phone has attempted the install. Install and runtime are recorded separately.
