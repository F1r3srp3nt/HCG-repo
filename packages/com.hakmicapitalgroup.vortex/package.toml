# Presentation and review metadata for HCG Vortex (free experimental beta).
# Package ID, name, version, architecture, dependencies, size and checksums always come from the imported .deb;
# nothing here can override them. Listing text adapted from the Vortex project's proposal
# (F1r3srp3nt/HCG-Jailbreak-Research, HCGVortex/distribution/hcg-repo/, commit 29d8565). See docs/VORTEX.md.

[release]
channel = "beta"

[access]
level = "public"
# HCG packages normally need HCG Connect sign-in. This exception is the approved free-release policy for HCG Vortex:
# proprietary freeware, free with no sign-in, for the versions listed below ONLY. Any other version (a later beta,
# a release, or a build with premium features sold through HCG Store) is refused until it is approved and listed.
exception = "Free experimental beta, proprietary freeware with no sign-in. Approved by the owner on 16 Nov 2026 for the versions in exception_versions only. Future versions may offer a free core plus optional premium features through HCG Store and need their own access decision."
# 0.1.0~beta2 (17 Nov 2026), 0.3.0~beta1 and 0.3.1~beta1 (18 Nov 2026, under the owner's standing policy that approved
# candidate builds are free public demos) are free public candidate demos.
exception_versions = ["0.1.0~beta1", "0.1.0~beta2", "0.3.0~beta1", "0.3.1~beta1"]

[display]
# summary is intentionally empty: the listing uses the Description from the .deb's control file.
icon = "icon.png"
tint = "#00E5FF"
notes = """
**Free experimental beta.** No sign-in and no payment. Expect rough edges and report problems.

HCG Vortex changes how Home Screen page transitions look without changing how navigation works. Swipe left and you still land on the next page.

**Icon effects (since 0.3.0~beta1):**
- **Tornado:** icons form a travelling funnel, with controls for funnel height, upper and lower radius, depth and travel, and the presets Subtle, Classic Tornado and Sci-Fi Vortex.
- **Orbital:** icons circle on concentric rings.
- **Warp:** icons pass through a short tunnel.
- **Holographic Layers:** floating parallax layers.
- **Circuit Flow:** icons run along glowing circuit traces.
- **Magnetic Grid:** a subtle loosen-and-snap, the everyday option.

Each effect has its own Settings page with a description, live preview, controls and Reset to Defaults. Reverse Slide, Vertical Rise, Vertical Fall and Custom Directions are still available. Folders, Today View, App Library and jiggle mode keep the normal iOS animation. Settings apply live, with no respring.

**New in 0.3.1~beta1:** fixes for the visual problems seen in a phone recording of the previous build: no flash of the next page's icons at the start of a swipe, Tornado reads as a funnel again, Orbital shows clear rings, and icon labels are hidden while icons are in a formation. No new effects.

**Device testing:** 0.3.1~beta1 has not yet been installed on a device. A phone recording of the previous build is partial evidence only (see Known issues). **Performance and battery impact:** unmeasured.
"""
known_issues = """
- **0.3.1~beta1 has not yet been installed on a device.** Its fixes are checked by regression tests on the recorded layout, not on a phone.
- **Phone recording of the previous build (18 Nov 2026, partial, version not confirmed):** a camera video of an iPhone 11 Pro Max (identified from its wallpaper) shows a build with all six effects installed and running Orbital, Tornado and Magnetic Grid, with HCG Halo enabled. The only such build is 0.3.0~beta1, but the installed version, iOS and jailbreak are not visible, so it is not recorded as a device test of any version. Completed, reversed and cancelled swipes restored the grid correctly. **Reported visual bugs**, fixed in 0.3.1~beta1: (F1) the incoming page's icons flash at their grid positions for about one frame at the start of a swipe, with doubled labels (Orbital, Tornado); (F2) Tornado forms a thin diagonal "rope" whose tip reaches the dock, with cluttered labels; (F3) Orbital forms a crowded disc with overlapping icons. Not shown: Warp, Holographic Layers, Circuit Flow, tapping apps after a transition, Reduce Motion, widgets.
- **Frame rate, performance and battery impact are unmeasured** for every version.
- With Reduce Motion on, every icon effect uses the stock animation. Widgets fade in place instead of joining a formation.
- Seen running alongside HCG Halo in the recording above, with no artefact attributable to Halo; not otherwise tested with HCG Halo, and not tested with HCG Nexus.
- **0.1.0~beta1 failed to install** on iPhone 11 Pro Max, iOS 17.4, Dopamine 2.x (rootless), Zebra 1.1.x (17 Nov 2026): the download worked, then unpacking stopped with `dpkg-deb: error: <decompress> subprocess was killed by signal (Bus error: 10)`. Nothing was installed. The cause is still under investigation.
- **0.1.0~beta2 is a packaging compatibility candidate.** It is the same tweak repackaged with gzip (`data.tar.gz`) and has not yet been installed on any device. Installation and runtime are not yet device-verified.
- **May crash SpringBoard.** Vortex hooks SpringBoard; its safety checks reduce but cannot rule out SpringBoard crashes. Recovery steps are under Removal.
- Animated page jumps (tapping the page dots) may use the stock animation.
"""
limitations = """
- **Tested:** only what Tested devices lists. Until a device test is recorded, no configuration has been tested.
- **Untested** (may work, not verified): any other device, iOS version or jailbreak; iPad; landscape Home Screen; use alongside other tweaks that change Home Screen paging (install only one).
- The package's minimum of iOS 15.0 is a build setting, not a compatibility claim. Vortex was designed from iOS 17 SpringBoard headers. On any version it installs no hooks unless every SpringBoard method it needs is present; Settings › HCG Vortex › *Engine Status* then reads *Incompatible*.
- Rootless only (`iphoneos-arm64`). Needs ElleKit (or another Substrate-compatible injector) and PreferenceLoader.
"""
install = """
1. Install **HCG Vortex (Beta)** and accept the dependencies offered (PreferenceLoader, an injector).
2. Respring when you choose.
3. Open **Settings › HCG Vortex**. *Engine Status* should read *Active*. *Incompatible* means your iOS build lacks something Vortex needs: it stays inactive and your Home Screen is unchanged.
4. Pick an **Animation Preset**. Changes apply immediately.
"""
removal = """
1. **Turn it off:** Settings › HCG Vortex › Enable Vortex → off. Stock animation immediately.
2. **Uninstall:** remove **HCG Vortex (Beta)** in your package manager, then respring.
3. Settings remain in `/var/mobile/Library/Preferences/com.hakmicapitalgroup.vortex.plist`. Purge the package or delete the file to erase them.
4. **If SpringBoard keeps crashing:** after 3 quick crashes Vortex stops loading itself (*Engine Status: Auto-disabled*). Otherwise, over SSH: `touch /var/mobile/Library/Preferences/com.hakmicapitalgroup.vortex.disabled` and respring. If you can't get in, reboot: Dopamine is semi-untethered, so the phone starts without tweaks; remove HCG Vortex before re-enabling tweak injection.
"""

[review]
