# Manual: put the isolated Sileo diagnostic sources, including the CANDIDATE source built from a review
# branch (diag/d8-candidate), on the live site WITHOUT changing the production source.
#
# /repo/ and the website are rebuilt from main exactly as the last Publish did (same commit, same
# SOURCE_DATE_EPOCH, so the same bytes). The run refuses unless the live site already serves main, so it can
# never publish anything new under /repo/. Only /diag/ comes from the branch. See docs/SILEO_CRASH.md and
# docs/VORTEX.md. Remove the diagnostics again by running Publish without "diagnostics".
name: Publish candidate (diagnostics only)

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Branch or full commit SHA whose pool becomes diag/d8-candidate (and whose diagnostics code is used)"
        required: true
        type: string
      confirm:
        description: "Type PUBLISH DIAGNOSTICS to deploy /diag/ (production /repo/ stays byte-identical)"
        required: true
        type: string

permissions: {}

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.cand.outputs.sha }}
    steps:
      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: '[ "$CONFIRM" = "PUBLISH DIAGNOSTICS" ] || { echo "::error::Type PUBLISH DIAGNOSTICS to confirm"; exit 1; }'

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: main
          lfs: false
          persist-credentials: false

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          lfs: false
          persist-credentials: false

      - name: Refuse unless production already serves main, unsigned
        working-directory: main
        run: |
          fpr=$(python3 -c 'import tomllib;print(tomllib.load(open("config/repo.toml","rb"))["signing"]["fingerprint"].strip())')
          [ -z "$fpr" ] || { echo "::error::signed repositories are not supported here; it would drop Release.gpg from /repo/"; exit 1; }
          base=$(python3 -c "import sys;sys.path.insert(0,'tools');from hcgrepo.config import load_config;print(load_config().base_url('production'))")
          live=$(curl -fsSL -H 'Cache-Control: no-cache' "${base}build-info.json?nocache=$RANDOM" | python3 -c 'import json,sys;print(json.load(sys.stdin)["revision"])')
          [ "$live" = "$GITHUB_SHA" ] || { echo "::error::production serves $live, not main ($GITHUB_SHA). Run Publish first; this workflow never changes /repo/."; exit 1; }

      - name: Rebuild production from main exactly as Publish did
        working-directory: main
        run: |
          python3 -m unittest discover -s tests
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) bin/hcgrepo build --target production --out ../_site

      - name: Prove /repo/ is unchanged against the live site
        run: |
          base=https://repo.hakmicapitalgroup.com/repo/
          for f in Release Packages Packages.xz Packages.gz Packages.bz2 sileo-featured.json CydiaIcon@3x.png; do
            a=$(sha256sum "_site/repo/$f" | cut -d' ' -f1)
            b=$(curl -fsSL -H 'Cache-Control: no-cache' "$base$f" | sha256sum | cut -d' ' -f1)
            [ "$a" = "$b" ] || { echo "::error::$f would change ($a vs live $b); refusing"; exit 1; }
            echo "unchanged: $f"
          done

      - name: Build the diagnostic sources from the candidate ref
        id: cand
        working-directory: candidate
        run: |
          python3 -m unittest discover -s tests
          bin/hcgrepo validate
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) bin/hcgrepo build --target production --out ../_cand --diagnostics
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf '{"candidate_ref": "%s", "candidate_sha": "%s"}\n' "$CANDIDATE_REF" "$sha" > ../_cand/diag/candidate.json
          [ -z "$(find ../_cand/diag -name '*.deb' -path '*/d[1-6]-*')" ] || { echo "::error::a .deb appeared in d1-d6"; exit 1; }
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}

      - name: Assemble production site + /diag/
        run: |
          cp -R _cand/diag _site/diag
          # The control must be the live production source (main), not the candidate's.
          rm -rf _site/diag/d7-production-copy && cp -R _site/repo _site/diag/d7-production-copy
          find _site/diag -type f | sort

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify-deployed:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: main
          lfs: false
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.build.outputs.candidate_sha }}
          path: candidate
          lfs: false
          persist-credentials: false
      - name: Wait for these diagnostics to be served
        env:
          SHA: ${{ needs.build.outputs.candidate_sha }}
        run: |
          for i in $(seq 1 30); do
            got=$(curl -fsSL -H 'Cache-Control: no-cache' "https://repo.hakmicapitalgroup.com/diag/candidate.json?nocache=$i" | python3 -c 'import json,sys;print(json.load(sys.stdin)["candidate_sha"])' || true)
            [ "$got" = "$SHA" ] && break
            echo "waiting for the diagnostics of $SHA (got '${got:-nothing}')"; sleep 20
          done
          [ "$got" = "$SHA" ] || { echo "::error::the live site does not serve these diagnostics"; exit 1; }
      - name: Production source unchanged (checked with main's configuration)
        working-directory: main
        run: bin/hcgrepo verify --target production --no-debs --evidence ../evidence/production
      - name: Every diagnostic source served as built (candidate's configuration)
        working-directory: candidate
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, "tools")
          from pathlib import Path
          from hcgrepo.config import load_config
          from hcgrepo.diagnostics import verify_all
          cfg = load_config()
          base = cfg.base_url("production")
          bad = 0
          for key, rep in verify_all(cfg, base, base, evidence=Path("../evidence")).items():
              print(f"diag/{key}: {'OK' if rep.ok else 'FAILED'}")
              if not rep.ok or rep.warnings:
                  print(rep.render())
              bad += not rep.ok
          sys.exit(1 if bad else 0)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: candidate-evidence
          path: evidence/
          retention-days: 30
