# Read-only diagnostics for the live site's transport: DNS, the TLS certificate actually served, HTTP→HTTPS
# redirects, redirects from the old GitHub Pages project URL, and GitHub's own record of the custom domain and
# certificate. It changes nothing. It fails when HTTPS for the production domain is not valid, so a red run
# means users would see "Not Secure" or a certificate error.
name: Check transport

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/check-transport.yml"
      - "tools/transport_check.sh"
      - "tools/hcgrepo/verify.py"

permissions: {}

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    env:
      HOST: repo.hakmicapitalgroup.com
      OLD_BASE: https://f1r3srp3nt.github.io/HCG-repo/
    steps:
      - name: GitHub Pages configuration (custom domain, certificate, HTTPS enforcement)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" > pages.json || { echo "::warning::Pages API not readable"; echo '{}' > pages.json; }
          python3 - <<'PY'
          import json, os
          d = json.load(open("pages.json"))
          cert = d.get("https_certificate") or {}
          rows = [("Pages URL", d.get("html_url")), ("Build type", d.get("build_type")), ("Custom domain", d.get("cname")),
                  ("HTTPS enforced", d.get("https_enforced")), ("Certificate state", cert.get("state")),
                  ("Certificate domains", ", ".join(cert.get("domains") or [])), ("Certificate expires", cert.get("expires_at")),
                  ("Domain protection", d.get("protected_domain_state"))]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## GitHub Pages\n\n| | |\n|---|---|\n" + "".join(f"| {k} | `{v}` |\n" for k, v in rows))
          for k, v in rows:
              print(f"{k}: {v}")
          PY

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: DNS (authoritative + public resolvers), per-address tests, certificate, APT endpoints
        run: |
          set +e
          tools/transport_check.sh "$HOST" /repo/ | tee report.md
          rc=${PIPESTATUS[0]}
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          [ $rc -eq 0 ] || echo "::error::HTTPS/APT delivery for $HOST is not correct (see the job summary)"
          exit $rc

      # Walks the live source the way Sileo refreshes it (Release, the Packages variants in Sileo's order,
      # Release.gpg, icons, sileo-featured.json, payment_endpoint read regardless of status, and the provider's
      # info when one is configured) and keeps every response as evidence. The evidence holds only public
      # repository metadata and images; it never contains packages, tokens or device identifiers.
      # --source-only: this branch's website configuration may differ from what is deployed (for example a prepared
      # product page); Publish's own verification checks the website.
      - name: Sileo-style walk of the live source, with evidence
        if: always()
        run: |
          set +e
          bin/hcgrepo verify --target production --no-debs --source-only --evidence evidence | tee sileo-walk.txt
          rc=${PIPESTATUS[0]}
          # The candidate (testing) source, downloading its packages and checking their checksums against the index.
          bin/hcgrepo verify --target production --channel candidate --source-only --evidence evidence/candidate | tee -a sileo-walk.txt
          [ ${PIPESTATUS[0]} -eq 0 ] || rc=1
          { echo "## Sileo-style walk (evidence artifact: sileo-evidence)"; echo '```'; cat sileo-walk.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cp sileo-walk.txt evidence/ 2>/dev/null
          exit $rc

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sileo-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
